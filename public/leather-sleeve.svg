<svg width="369.643" height="92" viewBox="0 0 369.643 92" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- The sleeve is the tray minus the Figma recess shape (same path as /figma/tray-recess.svg). -->
    <path id="recess" d="M0 0H369.643V21.3571H359.786C349.929 21.3571 344.452 26.8333 343.357 37.7857L341.714 44.3571C339.524 57.5 333.5 64.0714 323.643 64.0714H46C32.8571 64.0714 25.7381 57.5 24.6429 44.3571L23 37.7857C21.9048 26.8333 17.5238 21.3571 9.85714 21.3571H0V0Z"/>
    <mask id="sleeve" maskUnits="userSpaceOnUse" x="0" y="0" width="369.643" height="92">
      <rect width="369.643" height="92" rx="32.857" fill="#fff"/>
      <use href="#recess" fill="#000"/>
    </mask>
    <!-- Fine pebble grain multiplied with a soft, large-scale mottle, like matte leather. -->
    <filter id="leather" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="4" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0" result="grainMono"/>
      <feComponentTransfer in="grainMono" result="grainSoft">
        <feFuncR type="linear" slope="0.16" intercept="0.88"/>
        <feFuncG type="linear" slope="0.16" intercept="0.88"/>
        <feFuncB type="linear" slope="0.16" intercept="0.88"/>
        <feFuncA type="linear" slope="0" intercept="1"/>
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11" result="mottle"/>
      <feColorMatrix in="mottle" type="saturate" values="0" result="mottleMono"/>
      <feComponentTransfer in="mottleMono" result="mottleSoft">
        <feFuncR type="linear" slope="0.16" intercept="0.88"/>
        <feFuncG type="linear" slope="0.16" intercept="0.88"/>
        <feFuncB type="linear" slope="0.16" intercept="0.88"/>
        <feFuncA type="linear" slope="0" intercept="1"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grainSoft" mode="multiply" result="grained"/>
      <feBlend in="grained" in2="mottleSoft" mode="multiply"/>
    </filter>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <g mask="url(#sleeve)">
    <rect width="369.643" height="92" fill="#b9b09e" filter="url(#leather)"/>
    <rect width="369.643" height="92" fill="url(#shade)"/>

    <!-- Scuffs -->
    <g stroke="#efe8dc" stroke-opacity="0.35" stroke-width="0.5" stroke-linecap="round">
      <path d="M58 72C70 76 86 79 101 80"/>
      <path d="M212 70C219 74 223 80 226 87"/>
      <path d="M262 76L281 72"/>
      <path d="M8 40C10 50 13 58 18 64"/>
      <path d="M150 84C158 81 167 80 177 81"/>
      <path d="M352 48C350 55 347 61 342 67"/>
    </g>

    <!-- Rolled, burnished edge along the pocket opening and the outer rim -->
    <use href="#recess" stroke="#000" stroke-opacity="0.18" stroke-width="1"/>
    <use href="#recess" transform="translate(0 1.4)" stroke="#efe8dc" stroke-opacity="0.5" stroke-width="1.2"/>
    <rect x="0.5" y="0.5" width="368.643" height="91" rx="32.357" stroke="#000" stroke-opacity="0.12"/>

    <!-- Saddle stitching -->
    <g stroke="#5f5648" stroke-opacity="0.75" stroke-width="0.9" stroke-dasharray="2.6 2.2" stroke-linecap="round">
      <rect x="5.5" y="5.5" width="358.643" height="81" rx="27.5"/>
      <use href="#recess" transform="translate(0 5.5)"/>
    </g>
  </g>
</svg>
